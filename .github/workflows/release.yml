name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test "v$version" = "$GITHUB_REF_NAME"
      - run: cargo test --locked
      - name: Build
        run: |
          mkdir dist
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$target"
            tar -czf "dist/slack-cli-$target.tar.gz" -C "target/$target/release" slack-cli
            (cd dist && shasum -a 256 "slack-cli-$target.tar.gz" > "slack-cli-$target.tar.gz.sha256")
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
